<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Préstamos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app-content">
    <h1>Mis Préstamos</h1>
    <p>Presiona el botón + para registrar un nuevo préstamo.</p>
  </main>

  <button class="fab-btn" id="openFormBtn">+</button>

  <div class="app-modal" id="loanModal">
    <div class="app-modal-header">
      <button class="close-btn" id="closeFormBtn">←</button>
      <h2>Nuevo Préstamo</h2>
    </div>
    
    <form id="loanForm" class="app-modal-body">
      <div class="form-group">
        <label for="clientName">Nombre del Deudor</label>
        <input type="text" id="clientName" placeholder="Ej. María García" required>
      </div>

      <div class="form-group">
        <label for="amount">Monto Prestado</label>
        <input type="number" id="amount" placeholder="$0.00" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="interest">Interés (%)</label>
          <input type="number" id="interest" placeholder="10%">
        </div>
        <div class="form-group">
          <label for="term">Plazo</label>
          <input type="number" id="term" placeholder="4 semanas">
        </div>
      </div>

      <div class="form-group">
        <label for="startDate">Fecha de Inicio</label>
        <input type="date" id="startDate" required>
      </div>

      <div class="form-group">
        <label for="notes">Notas / Condiciones</label>
        <textarea id="notes" rows="3" placeholder="Detalles opcionales..."></textarea>
      </div>

      <button type="submit" class="save-btn">Guardar Préstamo</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
