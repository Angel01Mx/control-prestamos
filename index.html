<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Préstamos</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <h1 class="text-3xl font-bold text-gray-800">Administrador de Préstamos</h1>

    <!-- Buscador Principal -->
    <div class="bg-white p-4 rounded-xl shadow">
      <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre de cliente..." 
             class="w-full p-3 border rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Resumen Financiero -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
        <p class="text-sm text-blue-600 font-semibold">Total Prestado</p>
        <p id="totalPrestado" class="text-2xl font-bold text-blue-900">$0</p>
      </div>
      <div class="bg-green-50 p-4 rounded-xl border border-green-200">
        <p class="text-sm text-green-600 font-semibold">Total Cobrado</p>
        <p id="totalCobrado" class="text-2xl font-bold text-green-900">$0</p>
      </div>
      <div class="bg-red-50 p-4 rounded-xl border border-red-200">
        <p class="text-sm text-red-600 font-semibold">Pendiente por Cobrar</p>
        <p id="totalPendiente" class="text-2xl font-bold text-red-900">$0</p>
      </div>
    </div>

    <!-- Formulario Agregar Cliente -->
    <div class="bg-white p-6 rounded-xl shadow space-y-4">
      <h2 class="text-xl font-bold text-gray-700">Registrar Nuevo Préstamo</h2>
      <form id="loanForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="text" id="nombre" placeholder="Nombre completo" required class="p-2 border rounded">
        <input type="number" id="monto" placeholder="Monto prestado ($)" required class="p-2 border rounded">
        <button type="submit" class="bg-blue-600 text-white font-bold p-2 rounded hover:bg-blue-700">Guardar Préstamo</button>
      </form>
    </div>

    <!-- Lista de Clientes -->
    <div class="bg-white p-6 rounded-xl shadow space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-gray-700">Lista de Deudores</h2>
        <button onclick="exportarDatos()" class="text-sm bg-gray-200 hover:bg-gray-300 p-2 rounded">📥 Descargar Respaldo</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-gray-50">
              <th class="p-3">Cliente</th>
              <th class="p-3">Prestado</th>
              <th class="p-3">Pagado</th>
              <th class="p-3">Pendiente</th>
              <th class="p-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="clientList">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
