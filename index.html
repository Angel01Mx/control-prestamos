<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Préstamos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 mb-8">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-3 rounded-xl text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-wallet text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">Control de Préstamos</h1>
          <p class="text-xs text-slate-400">Administrador de cuentas y pagos</p>
        </div>
      </div>
      <button onclick="exportarDatos()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm border border-slate-600 text-slate-200 transition flex items-center gap-2">
        <i class="fa-solid fa-download text-indigo-400"></i> Respaldo
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 space-y-6">

    <!-- Buscador -->
    <div class="relative">
      <input type="text" id="searchInput" placeholder="🔍 Buscar cliente por nombre..." 
             class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-lg">
    </div>

    <!-- Resumen -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg">
        <p class="text-xs text-slate-400 font-semibold uppercase">Total Prestado</p>
        <p id="totalPrestado" class="text-2xl font-bold text-white mt-1">$0</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg">
        <p class="text-xs text-slate-400 font-semibold uppercase">Total Cobrado</p>
        <p id="totalCobrado" class="text-2xl font-bold text-emerald-400 mt-1">$0</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg">
        <p class="text-xs text-slate-400 font-semibold uppercase">Pendiente por Cobrar</p>
        <p id="totalPendiente" class="text-2xl font-bold text-rose-400 mt-1">$0</p>
      </div>
    </div>

    <!-- Formulario -->
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
      <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-indigo-400"></i> Registrar Nuevo Préstamo
      </h2>
      <form id="loanForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="text" id="nombre" placeholder="Nombre completo" required class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="number" id="monto" placeholder="Monto ($)" required class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold p-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">Guardar Préstamo</button>
      </form>
    </div>

    <!-- Lista -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg">
      <div class="p-4 border-b border-slate-700">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-400"></i> Lista de Deudores
        </h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead>
            <tr class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-slate-700">
              <th class="p-4">Cliente</th>
              <th class="p-4">Estado</th>
              <th class="p-4">Prestado</th>
              <th class="p-4">Pagado</th>
              <th class="p-4">Pendiente</th>
              <th class="p-4 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="clientList" class="divide-y divide-slate-700 text-sm">
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
