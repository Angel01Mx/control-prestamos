<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Préstamos</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">



  <header class="bg-slate-800 border-b border-slate-700 p-4 mb-8">

    <div class="max-w-6xl mx-auto flex justify-between items-center">

      <div>

        <h1 class="text-xl font-bold text-white tracking-wide">Control de Préstamos</h1>

        <p class="text-xs text-slate-400">Administrador de cuentas y pagos</p>

      </div>

      <button id="btnExportar" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm border border-slate-600 text-slate-200 transition">

        Respaldo

      </button>

    </div>

  </header>



  <main class="max-w-6xl mx-auto px-4 space-y-6">

    <div>

      <input type="text" id="searchInput" placeholder="Buscar cliente por nombre..." 

             class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-lg">

    </div>



    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg">

        <p class="text-xs text-slate-400 font-semibold uppercase">Total a Cobrar</p>

        <p id="totalPrestado" class="text-2xl font-bold text-white mt-1">$0</p>

      </div>

      <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg">

        <p class="text-xs text-slate-400 font-semibold uppercase">Total Cobrado</p>

        <p id="totalCobrado" class="text-2xl font-bold text-emerald-400 mt-1">$0</p>

      </div>

      <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg">

        <p class="text-xs text-slate-400 font-semibold uppercase">Pendiente por Cobrar</p>

        <p id="totalPendiente" class="text-2xl font-bold text-rose-400 mt-1">$0</p>

      </div>

    </div>



    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">

      <h2 class="text-lg font-bold text-white mb-4">Registrar Nuevo Préstamo</h2>

      <form id="loanForm" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">

        <div class="md:col-span-2">

          <label class="text-xs text-slate-400 mb-1 block">Cliente</label>

          <input type="text" id="nombre" placeholder="Nombre completo" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">

        </div>

        <div>

          <label class="text-xs text-slate-400 mb-1 block">Teléfono</label>

          <input type="tel" id="telefono" placeholder="Ej: 5512345678" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">

        </div>

        <div>

          <label class="text-xs text-slate-400 mb-1 block">Fecha Préstamo</label>

          <input type="date" id="fechaInicio" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">

        </div>

        <div class="md:col-span-2">

          <label class="text-xs text-slate-400 mb-1 block">Dirección / Domicilio</label>

          <input type="text" id="direccion" placeholder="Calle, número, colonia" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">

        </div>

        <div>

          <label class="text-xs text-slate-400 mb-1 block">Frecuencia</label>

          <select id="frecuencia" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">

            <option value="Diario">Diario</option>

            <option value="Semanal">Semanal</option>

            <option value="Catorcenal">Catorcenal</option>

            <option value="Quincenal">Quincenal</option>

            <option value="Mensual">Mensual</option>

          </select>

        </div>

        <div>

          <label class="text-xs text-slate-400 mb-1 block">Monto Entregado ($)</label>

          <input type="number" id="montoEntregado" placeholder="Ej: 5000" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">

        </div>

        <div>

          <label class="text-xs text-slate-400 mb-1 block">Total a Cobrar ($)</label>

          <input type="number" id="montoTotal" placeholder="Ej: 6000" required class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white">

        </div>

        <div class="md:col-span-3 lg:col-span-4 flex items-end">

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold p-3 rounded-xl shadow-lg transition">

            Guardar Préstamo

          </button>

        </div>

      </form>

    </div>



    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg">

      <div class="p-4 border-b border-slate-700">

        <h2 class="text-lg font-bold text-white">Lista de Deudores</h2>

      </div>

      <div class="overflow-x-auto">

        <table class="w-full text-left">

          <thead>

            <tr class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-slate-700">

              <th class="p-4">Cliente / Contacto</th>

              <th class="p-4">Frecuencia</th>

              <th class="p-4">Estado</th>

              <th class="p-4">Total a Cobrar</th>

              <th class="p-4">Pagado</th>

              <th class="p-4">Pendiente</th>

              <th class="p-4 text-center">Acciones</th>

            </tr>

          </thead>

          <tbody id="clientList" class="divide-y divide-slate-700 text-sm"></tbody>

        </table>

      </div>

    </div>

  </main>



  <script src="script.js"></script>

</body>

</html>
